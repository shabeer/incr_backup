[package]
name = "common"
version = "0.1.0"
edition = "2024"
description = "Reusable, project-agnostic foundation library for cloud tools and applications"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
log = "0.4"
rayon = "1"
walkdir = "2"
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"

