# ==============================================================================
# incr-backup Configuration File
# ==============================================================================
# Reverse-incremental, rsnapshot-style backups for rclone remotes.
#
# Configuration Priority (highest to lowest):
#   1. CLI arguments (--source, --remote, etc.)
#   2. Environment variables (INCR_BACKUP_SOURCE, INCR_BACKUP_REMOTE, etc.)
#   3. This TOML configuration file
#   4. Built-in defaults
# ==============================================================================

# ------------------------------------------------------------------------------
# [source] — Local Directory to Back Up
# ------------------------------------------------------------------------------
[source]
# Absolute or relative path to the local directory you want to back up.
# Must be an existing directory on the local filesystem.
#
# Examples:
#   path = "/home/alice/documents"
#   path = "/Users/alice/Projects"
#   path = "./data"
#   path = "C:\\Users\\alice\\Documents"
path = "/home/user/documents"


# ------------------------------------------------------------------------------
# [remote] — Rclone Destination
# ------------------------------------------------------------------------------
[remote]
# Rclone remote path where the backup will be stored.
# The remote will contain:
#   - current/   (the live mirror, directly browsable in cloud storage)
#   - diffs/     (reverse-incremental historical snapshots)
#   - .meta/     (manifests, locks, and config metadata)
#
# Examples:
#   Google Drive:  path = "gdrive:backups/myhost"
#   Amazon S3:     path = "s3:my-backup-bucket/myhost"
#   Dropbox:       path = "dropbox:backups/myhost"
#   Local / NAS:   path = "/Volumes/BackupDrive/myhost"
#   SFTP:          path = "myserver:/var/backups/myhost"
path = "gdrive:backups/myhost"


# ------------------------------------------------------------------------------
# [retention] — Snapshot Retention Policy
# ------------------------------------------------------------------------------
# Controls how many snapshot slots are kept at each rotation tier.
# Rotation moves oldest snapshots up the tiers (hourly -> daily -> weekly -> monthly)
# and deletes the oldest snapshot once a tier's limit is reached.
#
# Available Preset Values:
#
# 1. "default" preset (Balanced — recommended for typical use):
#    hourly = 6, daily = 7, weekly = 4, monthly = 6, min_interval_minutes = 30
#    History: ~6 hours + 1 week + 1 month + 6 months
#
# 2. "aggressive" preset (Deeper history, higher storage usage):
#    hourly = 12, daily = 14, weekly = 8, monthly = 12, min_interval_minutes = 30
#    History: ~12 hours + 2 weeks + 2 months + 1 year
#
# 3. "minimal" preset (Space-saving, lean footprint):
#    hourly = 3, daily = 3, weekly = 2, monthly = 3, min_interval_minutes = 30
#    History: ~3 hours + 3 days + 2 weeks + 3 months
# ------------------------------------------------------------------------------
[retention]
# Number of hourly snapshot slots to retain (must be > 0).
# Example values: 3 (minimal), 6 (default), 12 (aggressive), 24 (full day)
hourly = 6

# Number of daily snapshot slots to retain (must be > 0).
# Example values: 3 (minimal), 7 (default, 1 week), 14 (aggressive, 2 weeks), 30 (1 month)
daily = 7

# Number of weekly snapshot slots to retain (must be > 0).
# Example values: 2 (minimal), 4 (default, ~1 month), 8 (aggressive, ~2 months)
weekly = 4

# Number of monthly snapshot slots to retain (must be > 0).
# Example values: 3 (minimal, quarter), 6 (default, half-year), 12 (aggressive, 1 year)
monthly = 6

# Minimum gap in minutes required between rotations at the same level.
# If a sync runs sooner than this interval, changes are updated in-place inside
# the current snapshot instead of creating a new rotated slot.
#
# Values:
#   30 = update in place if run within 30 minutes (prevents slot exhaustion)
#    0 = always rotate on every run (classic rsnapshot behavior)
#   60 = hourly snapshots rotate at most once per clock hour
min_interval_minutes = 30


# ------------------------------------------------------------------------------
# [rclone] — Rclone Transport Options
# ------------------------------------------------------------------------------
[rclone]
# Path to the rclone executable. Defaults to "rclone" (resolved via PATH).
#
# Examples:
#   path = "rclone"
#   path = "/usr/local/bin/rclone"
#   path = "/opt/homebrew/bin/rclone"
#   path = "C:\\Tools\\rclone\\rclone.exe"
path = "rclone"

# Extra command-line flags passed to every rclone invocation.
# Useful for tuning throughput, API limits, or specifying a custom rclone config.
#
# Common Examples:
#   High-speed transfers:      extra_flags = "--transfers 8 --checkers 16"
#   Google Drive optimizations: extra_flags = "--drive-acknowledge-abuse --fast-list"
#   Bandwidth rate limiting:   extra_flags = "--bwlimit 10M"
#   Custom config file:        extra_flags = "--config /home/user/.config/rclone/rclone.conf"
#   Disable cloud trash:       extra_flags = "--drive-use-trash=false"
extra_flags = ""


# ------------------------------------------------------------------------------
# [exclude] — Exclusion Patterns
# ------------------------------------------------------------------------------
# List of glob patterns to exclude from backup.
# Uses rclone filter syntax:
#   - `*.ext` matches any file ending with .ext
#   - `dir/**` matches directory `dir` and everything inside it
#   - `/top` matches `top` only at the root of the source directory
# ------------------------------------------------------------------------------
[exclude]
patterns = [
    # OS metadata and temporary files
    "*.tmp",
    "*.temp",
    "*.swp",
    "*~",
    ".DS_Store",
    "Thumbs.db",
    "desktop.ini",

    # Package managers and build artifacts
    "node_modules/**",
    "target/**",
    "__pycache__/**",
    "*.pyc",
    ".venv/**",
    ".tox/**",
    "dist/**",
    "build/**",

    # Version control internal directories (optional, remove if you want full repo backups)
    # ".git/**",

    # Logs and caches
    "*.log",
    ".cache/**"
]

